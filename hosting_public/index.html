<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SET</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FEFDFB;
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: #35333F;
      padding: 32px 20px;
    }
    .wrap { max-width: 420px; width: 100%; text-align: center; }
    .brand {
      font-family: 'Space Mono', 'Courier New', monospace;
      letter-spacing: 4px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    h1 { font-size: 24px; font-weight: 600; font-style: italic; margin: 0 0 10px; }
    p { font-size: 15px; color: #9B8E7B; margin: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">SET</div>
    <h1>Setteki işler burada.</h1>
    <p>Bir paylaşım linkiyle mi geldin? Linki tam olarak kopyaladığından emin ol.</p>
  </div>
</body>
</html>
